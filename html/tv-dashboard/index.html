<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="industrial-scanner-dashboard-build" content="1.8">
  <title>TV Dashboard</title>
  <link rel="stylesheet" href="/assets/site.css?v=1.8">
</head>
<body class="tv-body">
  <div class="tv-viewport">
    <div id="tv-stage" class="tv-stage">
      <main class="tv-page">
        <header class="tv-header">
          <div
            id="tv-status"
            class="tv-status"
            role="status"
            aria-live="polite"
            aria-atomic="true"
            hidden
          ></div>
        </header>

        <section class="tv-rate-grid">
          <div class="tv-panel tv-rate-panel">
            <div class="tv-label">Scans Per Minute</div>
            <div id="tv-scans-minute" class="tv-value">0</div>
          </div>
          <div class="tv-panel tv-rate-panel">
            <div class="tv-label">Scans Per Hour</div>
            <div id="tv-scans-hour" class="tv-value">0</div>
          </div>
        </section>

        <section class="tv-panel tv-today-panel">
          <div class="tv-day-title">Today</div>
          <div id="tv-today-date" class="tv-date">Loading...</div>
          <div class="tv-stat-row">
            <div class="tv-stat-card">
              <div class="tv-label">Total</div>
              <div id="tv-today-total" class="tv-value">0</div>
            </div>
            <div class="tv-stat-card">
              <div class="tv-label">Successful</div>
              <div id="tv-today-success" class="tv-value success">0</div>
            </div>
            <div class="tv-stat-card">
              <div class="tv-label">Duplicates</div>
              <div id="tv-today-duplicates" class="tv-value duplicate">0</div>
            </div>
            <div class="tv-stat-card">
              <div class="tv-label">Failed</div>
              <div id="tv-today-failed" class="tv-value failed">0</div>
            </div>
          </div>
        </section>

        <section class="tv-secondary-grid">
          <div class="tv-panel">
            <div class="tv-day-title">Last Received Data</div>
            <div id="tv-last-received-time" class="tv-value tv-elapsed-time">Checking</div>
            <div id="tv-last-received-detail" class="tv-date">Waiting for data</div>
          </div>

          <div class="tv-panel">
            <div class="tv-day-title">Connected Scanners</div>
            <div id="tv-connected-count" class="tv-value">0</div>
            <div id="tv-connected-detail" class="tv-date">Checking...</div>
          </div>
        </section>
      </main>

      <div id="tv-package-alert" class="tv-duplicate-alert" role="alert" aria-live="assertive" hidden>
        <div class="tv-duplicate-alert-content">
          <div id="tv-alert-kicker" class="tv-duplicate-kicker">Duplicate Package</div>
          <div id="tv-alert-action" class="tv-duplicate-action">Remove This Package</div>
          <div class="tv-duplicate-details">
            <div>
              <div class="tv-duplicate-label">Tracking Number</div>
              <div id="tv-alert-tracking" class="tv-duplicate-value">----------</div>
            </div>
            <div>
              <div class="tv-duplicate-label">Scanner</div>
              <div id="tv-alert-scanner" class="tv-duplicate-value">Unknown</div>
            </div>
          </div>
          <div id="tv-alert-time" class="tv-duplicate-time">Detected now</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "/api/v1/dashboard/health";
    const DASHBOARD_DOCUMENT_URL = "/tv-dashboard/index.html";
    const TV_DASHBOARD_BUILD = "1.8";
    const TV_DASHBOARD_UPDATE_CHECK_MS = 60 * 1000;
    const DEFAULT_DISPLAY_TIME_ZONE = "America/Detroit";
    const DEFAULT_TV_REFRESH_SECONDS = 1;
    const DEFAULT_TV_DUPLICATE_ALERT_SECONDS = 60;
    const DEFAULT_TV_OUTGOING_API_QUEUE_ALERT_THRESHOLD = 25;
    const TV_CANVAS_WIDTH = 1920;
    const TV_CANVAS_HEIGHT = 1080;
    const MAX_SEEN_PACKAGE_ALERT_IDS = 300;
    const TV_SINGLE_LINE_SELECTOR = [
      "#tv-status",
      ".tv-page .tv-label",
      ".tv-page .tv-value",
      ".tv-page .tv-day-title",
      ".tv-page .tv-date",
      ".tv-duplicate-kicker",
      ".tv-duplicate-action",
      ".tv-duplicate-label",
      ".tv-duplicate-value",
      ".tv-duplicate-time"
    ].join(", ");
    let tvRefreshTimer = null;
    let tvRefreshIntervalMs = null;
    let dashboardDocumentFingerprint = null;
    let tvTextFitFrame = null;
    let activePackageAlert = null;
    let packageAlertQueue = [];
    let packageAlertTimer = null;
    let packageAlarmInterval = null;
    let packageAudioContext = null;
    let displayTimeZone = DEFAULT_DISPLAY_TIME_ZONE;
    const seenPackageAlertIds = new Set();

    async function loadDashboard() {
      try {
        const response = await fetch(API_URL, { cache: "no-store" });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        displayTimeZone = data.display_timezone || DEFAULT_DISPLAY_TIME_ZONE;
        renderDashboard(data);
      } catch (error) {
        setSystemStatus("critical", ["Health dashboard API unavailable."]);
      }
    }

    async function checkForDashboardUpdate() {
      try {
        const response = await fetch(DASHBOARD_DOCUMENT_URL, { cache: "no-store" });

        if (!response.ok) {
          return;
        }

        const documentText = await response.text();
        const servedBuild = dashboardBuildFromDocument(documentText);
        const nextFingerprint = fingerprintText(documentText);
        const buildChanged = servedBuild && servedBuild !== TV_DASHBOARD_BUILD;
        const documentChanged = (
          dashboardDocumentFingerprint !== null &&
          nextFingerprint !== dashboardDocumentFingerprint
        );

        if (buildChanged || documentChanged) {
          window.location.reload();
          return;
        }

        dashboardDocumentFingerprint = nextFingerprint;
      } catch (_error) {
        // A failed update check must not interfere with live dashboard polling.
      }
    }

    function dashboardBuildFromDocument(documentText) {
      const parsedDocument = new DOMParser().parseFromString(documentText, "text/html");
      return parsedDocument.querySelector(
        'meta[name="industrial-scanner-dashboard-build"]'
      )?.content || "";
    }

    function fingerprintText(value) {
      let hash = 2166136261;

      for (let index = 0; index < value.length; index += 1) {
        hash ^= value.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }

      return `${value.length}:${hash >>> 0}`;
    }

    function setSystemStatus(severity, messages = []) {
      const status = document.getElementById("tv-status");
      const degraded = severity !== "ok";

      status.classList.toggle("health-overlay", degraded);
      status.classList.toggle("warning", severity === "warning");
      status.classList.toggle("offline", severity === "critical");
      status.setAttribute("role", degraded ? "alert" : "status");
      status.setAttribute("aria-live", severity === "critical" ? "assertive" : "polite");
      status.hidden = !degraded;

      if (!degraded) {
        status.textContent = "";
        return;
      }

      const heading = severity === "critical" ? "SYSTEM PROBLEM" : "SYSTEM WARNING";
      const detail = messages.filter(Boolean).join(" • ");
      status.textContent = detail ? `${heading} — ${detail}` : heading;
      scheduleTvTextFit();
    }

    function fitTvStageToViewport() {
      const stage = document.getElementById("tv-stage");

      if (!stage) {
        return;
      }

      const scale = Math.min(
        window.innerWidth / TV_CANVAS_WIDTH,
        window.innerHeight / TV_CANVAS_HEIGHT
      );
      const safeScale = Math.max(0, scale);
      const scaledWidth = TV_CANVAS_WIDTH * safeScale;
      const scaledHeight = TV_CANVAS_HEIGHT * safeScale;

      stage.style.left = `${Math.max(0, (window.innerWidth - scaledWidth) / 2)}px`;
      stage.style.top = `${Math.max(0, (window.innerHeight - scaledHeight) / 2)}px`;
      stage.style.transform = `scale(${safeScale})`;
    }

    function handleTvViewportResize() {
      fitTvStageToViewport();
      scheduleTvTextFit();
    }

    function renderDashboard(data) {
      const rate = data.current_scan_rate || {};
      const totals = data.daily_totals || {};
      const today = totals.today || {};
      const healthIssues = dashboardHealthIssues(data);

      setSystemStatus(
        highestHealthSeverity(healthIssues),
        healthIssues.map((issue) => issue.message)
      );
      configureTvRefresh(data.tv_dashboard_refresh_seconds);

      setText("tv-scans-minute", formatNumber(rate.scans_per_minute));
      setText("tv-scans-hour", formatNumber(rate.scans_per_hour));

      setText("tv-today-date", today.scan_date || "");
      setText("tv-today-total", formatNumber(today.total_scan_events));
      setText("tv-today-success", formatNumber(today.successful_scans));
      setText("tv-today-duplicates", formatNumber(today.duplicate_scans));
      setText("tv-today-failed", formatNumber(today.failed_scans));

      queuePackageAlerts(
        packageAlertsFromPayload(data),
        data.tv_duplicate_alert_seconds || DEFAULT_TV_DUPLICATE_ALERT_SECONDS
      );
      renderLastReceived(data.last_received, data.generated_at);
      renderConnectedScanners(data);
      scheduleTvTextFit();
    }

    function dashboardHealthIssues(data) {
      const issues = [];
      const scannerService = data.services?.scanner;
      const apiService = data.services?.api;
      const database = data.database;
      const mandatoryScanners = data.mandatory_scanners;
      const storage = data.storage;
      const outgoingApi = data.outgoing_api;

      if (scannerService && !scannerService.active) {
        issues.push({
          severity: "critical",
          message: serviceProblemMessage("Scanner receiver not running", scannerService)
        });
      }

      if (apiService && !apiService.active) {
        issues.push({
          severity: "critical",
          message: serviceProblemMessage("Scanner API service not running", apiService)
        });
      }

      if (database && !database.active) {
        issues.push({
          severity: "critical",
          message: "PostgreSQL unavailable."
        });
      }

      if (mandatoryScanners?.warning) {
        issues.push({
          severity: "warning",
          message: mandatoryScanners.warning
        });
      }

      if (storage && !storage.ok) {
        issues.push({
          severity: "warning",
          message: storageWarningMessage(storage)
        });
      }

      if (
        outgoingApi?.enabled &&
        outgoingApi.state !== "ok" &&
        outgoingApiQueueExceedsAlertThreshold(
          outgoingApi,
          data.tv_outgoing_api_queue_alert_threshold
        )
      ) {
        issues.push({
          severity: "warning",
          message: outgoingApiWarningMessage(outgoingApi)
        });
      }

      if (data.status === "degraded" && issues.length === 0) {
        issues.push({
          severity: "warning",
          message: "System health is degraded."
        });
      }

      return issues;
    }

    function outgoingApiQueueExceedsAlertThreshold(outgoingApi, configuredThreshold) {
      const queueCount = Number(outgoingApi?.queue_count || 0);
      const threshold = Number(
        configuredThreshold ?? DEFAULT_TV_OUTGOING_API_QUEUE_ALERT_THRESHOLD
      );
      const safeQueueCount = Number.isFinite(queueCount) ? Math.max(0, queueCount) : 0;
      const safeThreshold = Number.isFinite(threshold) && threshold > 0
        ? threshold
        : DEFAULT_TV_OUTGOING_API_QUEUE_ALERT_THRESHOLD;

      return safeQueueCount > safeThreshold;
    }

    function highestHealthSeverity(issues) {
      if (issues.some((issue) => issue.severity === "critical")) {
        return "critical";
      }

      return issues.length > 0 ? "warning" : "ok";
    }

    function serviceProblemMessage(label, service) {
      const state = String(service?.state || "").trim();
      return state ? `${label} (${state}).` : `${label}.`;
    }

    function storageWarningMessage(storage) {
      const lowest = storage.lowest;

      if (!lowest) {
        return "Drive space warning.";
      }

      const freeBytes = Number(lowest.free_bytes);
      const freePercent = Number(lowest.free_percent);
      const details = [];

      if (Number.isFinite(freeBytes)) {
        details.push(`${formatBytes(freeBytes)} free`);
      }

      if (Number.isFinite(freePercent)) {
        details.push(`${formatPercent(freePercent)} free`);
      }

      const label = lowest.label || "Monitored drive";
      let detailText = details[0] || "";

      if (details.length > 1) {
        detailText = `${details[0]} (${details[1]})`;
      }

      return detailText
        ? `Low drive space: ${label} has ${detailText}.`
        : `Low drive space: ${label}.`;
    }

    function outgoingApiWarningMessage(outgoingApi) {
      const queueCount = Number(outgoingApi.queue_count || 0);
      const queueText = `${formatInteger(queueCount)} queued`;
      const httpStatus = Number(outgoingApi.last_http_status);
      const statusText = Number.isFinite(httpStatus) && httpStatus > 0
        ? `, HTTP ${httpStatus}`
        : "";
      const stateLabels = {
        pending: "pending",
        misconfigured: "misconfigured",
        unavailable: "unavailable",
        unknown: "unavailable"
      };
      const stateLabel = stateLabels[outgoingApi.state] || "unavailable";

      return `Outgoing API ${stateLabel}: ${queueText}${statusText}.`;
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value;
      scheduleTvTextFit();
    }

    function scheduleTvTextFit() {
      if (tvTextFitFrame !== null) {
        window.cancelAnimationFrame(tvTextFitFrame);
      }

      tvTextFitFrame = window.requestAnimationFrame(() => {
        tvTextFitFrame = null;
        document.querySelectorAll(TV_SINGLE_LINE_SELECTOR).forEach(
          fitTvTextToSingleLine
        );
      });
    }

    function fitTvTextToSingleLine(element) {
      if (!element || element.hidden || element.clientWidth <= 0) {
        return;
      }

      element.style.removeProperty("font-size");
      const naturalFontSize = Number.parseFloat(
        window.getComputedStyle(element).fontSize
      );

      if (
        !Number.isFinite(naturalFontSize) ||
        element.scrollWidth <= element.clientWidth
      ) {
        return;
      }

      let smallestFontSize = 1;
      let largestFontSize = naturalFontSize;
      let fittedFontSize = smallestFontSize;

      while (largestFontSize - smallestFontSize > 0.1) {
        const candidateFontSize = (smallestFontSize + largestFontSize) / 2;
        element.style.fontSize = `${candidateFontSize}px`;

        if (element.scrollWidth <= element.clientWidth) {
          fittedFontSize = candidateFontSize;
          smallestFontSize = candidateFontSize;
        } else {
          largestFontSize = candidateFontSize;
        }
      }

      let finalFontSize = Math.max(1, fittedFontSize - 0.2);
      element.style.fontSize = `${finalFontSize.toFixed(1)}px`;

      while (
        element.scrollWidth > element.clientWidth &&
        finalFontSize > 1
      ) {
        finalFontSize = Math.max(1, finalFontSize - 0.1);
        element.style.fontSize = `${finalFontSize.toFixed(1)}px`;
      }
    }

    function renderLastReceived(lastReceived, generatedAt) {
      if (!lastReceived) {
        setText("tv-last-received-time", "No Data");
        setText("tv-last-received-detail", "No scan rows found.");
        return;
      }

      setText(
        "tv-last-received-time",
        formatElapsedTime(lastReceived, undefined, dashboardReferenceTime(generatedAt))
      );
      setText(
        "tv-last-received-detail",
        formatScanDateTime(lastReceived)
      );
    }

    function dashboardReferenceTime(generatedAt) {
      const referenceTime = new Date(String(generatedAt || ""));
      return Number.isNaN(referenceTime.getTime()) ? new Date() : referenceTime;
    }

    function renderConnectedScanners(data) {
      const connectedIds = data.connected_scanner_ids || [];
      const connectedCount = Number(data.connected_scanner_count ?? connectedIds.length);
      const mandatoryScanners = data.mandatory_scanners || {};
      const requiredMandatoryCount = Number(
        mandatoryScanners.required_count ??
        mandatoryScanners.required_scanner_ids?.length ??
        0
      );
      const connectedMandatoryCount = Number(
        mandatoryScanners.connected_count ??
        mandatoryScanners.connected_required_scanner_ids?.length ??
        0
      );
      if (mandatoryScanners.configured) {
        const offlineLabels = offlineMandatoryScannerLabels(mandatoryScanners);
        setText(
          "tv-connected-count",
          `${formatNumber(connectedMandatoryCount)} of ${formatNumber(requiredMandatoryCount)}`
        );
        setText(
          "tv-connected-detail",
          offlineLabels.length > 0
            ? `Offline: ${offlineLabels.join(", ")}`
            : "All mandatory scanners online"
        );
        document.getElementById("tv-connected-detail").classList.toggle(
          "warning",
          offlineLabels.length > 0
        );
        return;
      }

      setText("tv-connected-count", formatNumber(connectedCount));
      document.getElementById("tv-connected-detail").classList.remove("warning");
      setText("tv-connected-detail", "No mandatory scanners configured.");
    }

    function offlineMandatoryScannerLabels(mandatoryScanners) {
      if (Array.isArray(mandatoryScanners?.required_scanners)) {
        return mandatoryScanners.required_scanners
          .filter((scanner) => !scanner.connected)
          .map(scannerDisplayName)
          .filter(Boolean);
      }

      return (mandatoryScanners?.missing_scanner_ids || [])
        .map((scannerId) => `Scanner ${scannerId}`)
        .filter(Boolean);
    }

    function scannerDisplayName(row) {
      if (row.display_name) {
        return row.display_name;
      }

      if (row.scanner_name) {
        return row.scanner_name;
      }

      if (
        row.scanner_id !== undefined &&
        row.scanner_id !== null &&
        row.scanner_id !== ""
      ) {
        return `Scanner ${row.scanner_id}`;
      }

      return "";
    }

    function packageAlertsFromPayload(data) {
      if (Array.isArray(data.package_alerts)) {
        return data.package_alerts;
      }

      if (data.duplicate_alert) {
        return [{ ...data.duplicate_alert, alert_type: "duplicate" }];
      }

      return [];
    }

    function queuePackageAlerts(alerts, configuredSeconds) {
      for (const alert of alerts) {
        const alertId = packageAlertId(alert);

        if (!alertId || seenPackageAlertIds.has(alertId)) {
          continue;
        }

        seenPackageAlertIds.add(alertId);
        trimSeenPackageAlertIds();
        packageAlertQueue.push({
          ...alert,
          alert_id: alertId,
          display_seconds: alertDisplaySeconds(alert, configuredSeconds)
        });
      }

      if (!activePackageAlert) {
        showNextPackageAlert();
      }
    }

    function showNextPackageAlert() {
      if (packageAlertTimer) {
        window.clearTimeout(packageAlertTimer);
        packageAlertTimer = null;
      }

      activePackageAlert = packageAlertQueue.shift() || null;

      if (!activePackageAlert) {
        hidePackageAlert();
        return;
      }

      renderPackageAlert(activePackageAlert);
      startPackageAlarm();

      packageAlertTimer = window.setTimeout(
        finishActivePackageAlert,
        Math.max(1000, activePackageAlert.display_seconds * 1000)
      );
    }

    function renderPackageAlert(alert) {
      const overlay = document.getElementById("tv-package-alert");
      const barcodeDigits = alert.barcode_last_12 || lastDigits(
        alert.tracking_number || alert.barcode || "",
        12
      );
      const scannerName = scannerDisplayName(alert) || "Unknown Scanner";

      setText("tv-alert-kicker", "Duplicate Package");
      setText("tv-alert-action", "Remove This Package");
      setText("tv-alert-tracking", barcodeDigits || "Unknown");
      setText("tv-alert-scanner", scannerName);
      setText(
        "tv-alert-time",
        `Detected ${formatScanDateTime(alert) || "now"}`
      );

      overlay.hidden = false;
      document.body.classList.add("tv-alert-active");
      scheduleTvTextFit();
    }

    function finishActivePackageAlert() {
      activePackageAlert = null;
      showNextPackageAlert();
    }

    function hidePackageAlert() {
      const overlay = document.getElementById("tv-package-alert");

      if (overlay) {
        overlay.hidden = true;
      }

      document.body.classList.remove("tv-alert-active");
      activePackageAlert = null;

      if (packageAlertTimer) {
        window.clearTimeout(packageAlertTimer);
        packageAlertTimer = null;
      }

      stopPackageAlarm();
    }

    function packageAlertId(alert) {
      if (alert.alert_id) {
        return String(alert.alert_id);
      }

      const alertType = alert.alert_type || "duplicate";
      return String(
        `${alertType}:${alert.id ?? `${alert.scan_date || ""}-${alert.scan_time || ""}-${alert.barcode || ""}`}`
      );
    }

    function alertDisplaySeconds(alert, configuredSeconds) {
      const displaySeconds = Number(
        alert.alert_seconds || configuredSeconds || DEFAULT_TV_DUPLICATE_ALERT_SECONDS
      );

      return Number.isFinite(displaySeconds) && displaySeconds > 0
        ? displaySeconds
        : DEFAULT_TV_DUPLICATE_ALERT_SECONDS;
    }

    function trimSeenPackageAlertIds() {
      while (seenPackageAlertIds.size > MAX_SEEN_PACKAGE_ALERT_IDS) {
        const oldestAlertId = seenPackageAlertIds.values().next().value;
        seenPackageAlertIds.delete(oldestAlertId);
      }
    }

    function startPackageAlarm() {
      if (packageAlarmInterval) {
        return;
      }

      playPackageBeep();
      packageAlarmInterval = window.setInterval(playPackageBeep, 900);
    }

    function stopPackageAlarm() {
      if (packageAlarmInterval) {
        window.clearInterval(packageAlarmInterval);
        packageAlarmInterval = null;
      }
    }

    function playPackageBeep() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) {
        return;
      }

      try {
        if (!packageAudioContext) {
          packageAudioContext = new AudioContextClass();
        }

        if (packageAudioContext.state === "suspended") {
          packageAudioContext.resume().catch(() => {});
        }

        const now = packageAudioContext.currentTime;
        const oscillator = packageAudioContext.createOscillator();
        const gain = packageAudioContext.createGain();

        oscillator.type = "square";
        oscillator.frequency.setValueAtTime(740, now);
        oscillator.frequency.setValueAtTime(1040, now + 0.22);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.7, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.62);

        oscillator.connect(gain);
        gain.connect(packageAudioContext.destination);
        oscillator.start(now);
        oscillator.stop(now + 0.65);
        oscillator.onended = () => {
          oscillator.disconnect();
          gain.disconnect();
        };
      } catch (_error) {
        stopPackageAlarm();
      }
    }

    function lastDigits(value, digitCount) {
      return String(value || "").replace(/\D/g, "").slice(-digitCount);
    }

    function formatNumber(value) {
      const numericValue = Number(value || 0);

      if (!Number.isFinite(numericValue)) {
        return "0";
      }

      return numericValue.toLocaleString(undefined, {
        maximumFractionDigits: 2,
      });
    }

    function formatInteger(value) {
      const numericValue = Number(value || 0);
      return Number.isFinite(numericValue)
        ? Math.max(0, Math.floor(numericValue)).toLocaleString()
        : "0";
    }

    function formatBytes(value) {
      const bytes = Number(value || 0);
      const units = ["B", "KB", "MB", "GB", "TB"];
      let size = Math.max(0, bytes);
      let unitIndex = 0;

      while (size >= 1024 && unitIndex < units.length - 1) {
        size /= 1024;
        unitIndex += 1;
      }

      const digits = size >= 100 || unitIndex === 0 ? 0 : 1;
      return `${size.toFixed(digits)} ${units[unitIndex]}`;
    }

    function formatPercent(value) {
      const percent = Number(value);
      return Number.isFinite(percent) ? `${percent.toFixed(1)}%` : "unknown";
    }

    function configureTvRefresh(refreshSeconds) {
      const intervalMs = refreshIntervalMs(refreshSeconds, DEFAULT_TV_REFRESH_SECONDS);

      if (tvRefreshTimer && intervalMs === tvRefreshIntervalMs) {
        return;
      }

      if (tvRefreshTimer) {
        window.clearInterval(tvRefreshTimer);
      }

      tvRefreshIntervalMs = intervalMs;
      tvRefreshTimer = window.setInterval(loadDashboard, intervalMs);
    }

    function refreshIntervalMs(value, defaultSeconds) {
      const seconds = Number(value || defaultSeconds);

      if (!Number.isFinite(seconds) || seconds <= 0) {
        return defaultSeconds * 1000;
      }

      return Math.max(1000, seconds * 1000);
    }

    function formatElapsedTime(scanDateOrRow, scanTime, now = new Date()) {
      const parts = scanDateTimeParts(scanDateOrRow, scanTime);

      if (!parts.scanTimestamp && (!parts.scanDate || !parts.scanTime)) {
        return "Unknown";
      }

      const scanDateTime = parseScanDateTime(scanDateOrRow, scanTime);

      if (!scanDateTime) {
        return "Unknown";
      }

      return formatElapsedSince(scanDateTime, 10, now);
    }

    function formatElapsedSince(value, nowThresholdSeconds, now = new Date()) {
      const elapsedSeconds = Math.max(
        0,
        Math.floor((now.getTime() - value.getTime()) / 1000)
      );

      if (elapsedSeconds <= nowThresholdSeconds) {
        return "Now";
      }

      const units = [
        {
          label: "Week",
          seconds: 7 * 24 * 60 * 60,
          thresholdSeconds: 4 * 7 * 24 * 60 * 60
        },
        {
          label: "Day",
          seconds: 24 * 60 * 60,
          thresholdSeconds: 24 * 60 * 60
        },
        {
          label: "Hour",
          seconds: 60 * 60,
          thresholdSeconds: 60 * 60
        },
        {
          label: "Min",
          seconds: 60,
          thresholdSeconds: 60
        },
        {
          label: "Sec",
          seconds: 1,
          thresholdSeconds: 0
        }
      ];

      for (let index = 0; index < units.length; index += 1) {
        const primary = units[index];

        if (elapsedSeconds < primary.thresholdSeconds) {
          continue;
        }

        const primaryValue = Math.floor(elapsedSeconds / primary.seconds);
        const parts = [formatElapsedPart(primaryValue, primary.label)];
        const secondary = units[index + 1];

        if (secondary && primary.label !== "Sec") {
          const remainder = elapsedSeconds % primary.seconds;
          const secondaryValue = Math.floor(remainder / secondary.seconds);

          if (secondaryValue > 0) {
            parts.push(formatElapsedPart(secondaryValue, secondary.label));
          }
        }

        return parts.join(", ");
      }

      return "Now";
    }

    function formatElapsedPart(value, label) {
      const plural = ["Week", "Day", "Hour"].includes(label) && value !== 1
        ? "s"
        : "";
      return `${value.toLocaleString()} ${label}${plural}`;
    }

    function formatScanDateTime(scanDateOrRow, scanTime) {
      const parts = scanDateTimeParts(scanDateOrRow, scanTime);

      if (!parts.scanDate && !parts.scanTime && !parts.scanTimestamp) {
        return "";
      }

      const parsed = parseScanDateTime(scanDateOrRow, scanTime);

      if (!parsed) {
        return `${parts.scanDate || ""} ${parts.scanTime || ""}`.trim();
      }

      return `${parts.scanDate || displayDateString(parsed)} ${formatMeridiem(parsed)}`;
    }

    function parseScanDateTime(scanDateOrRow, scanTime) {
      const parts = scanDateTimeParts(scanDateOrRow, scanTime);
      const parsed = new Date(scanTimestampText(parts));

      if (Number.isNaN(parsed.getTime())) {
        return null;
      }

      return parsed;
    }

    function scanDateTimeParts(scanDateOrRow, scanTime) {
      if (scanDateOrRow && typeof scanDateOrRow === "object") {
        return {
          scanDate: scanDateOrRow.scan_date || "",
          scanTime: scanDateOrRow.scan_time || "",
          scanTimestamp: scanDateOrRow.scan_timestamp || ""
        };
      }

      return {
        scanDate: scanDateOrRow || "",
        scanTime: scanTime || "",
        scanTimestamp: ""
      };
    }

    function scanTimestampText(parts) {
      if (parts.scanTimestamp) {
        return String(parts.scanTimestamp);
      }

      const datePart = parts.scanDate || "1970-01-01";
      const normalizedTime = String(parts.scanTime || "").replace(/(\.\d{3})\d+$/, "$1");
      return `${datePart}T${normalizedTime}`;
    }

    function displayDateString(value) {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: displayTimeZone,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(value);
      const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      return `${values.year}-${values.month}-${values.day}`;
    }

    function formatMeridiem(value) {
      return value.toLocaleTimeString("en-US", {
        timeZone: displayTimeZone,
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      }).replace(/\s?(AM|PM)$/i, (suffix) => suffix.toLowerCase());
    }

    fitTvStageToViewport();
    loadDashboard();
    configureTvRefresh(DEFAULT_TV_REFRESH_SECONDS);
    checkForDashboardUpdate();
    window.setInterval(checkForDashboardUpdate, TV_DASHBOARD_UPDATE_CHECK_MS);
    window.addEventListener("resize", handleTvViewportResize);
    scheduleTvTextFit();
  </script>
</body>
</html>
